# Render Blueprint — native runtime, no Dockerfile.
# Render's build image already has Node + Python, so the build command can run
# the frontend build and the backend install in one native Python service.
services:
  - type: web
    name: trade-craft
    runtime: python
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      # BYOK (2026-09-17): each visitor supplies their own Anthropic key from
      # the app itself, so this is now a LOCAL-DEV-ONLY convenience fallback -
      # leave it blank on a shared/deployed host, or a visitor without their
      # own key silently falls back to spending yours. See docs/DEPLOY.md.
      - key: TRADE101_ANALYSIS_KEY
        sync: false
      - key: TRADE101_NEWS_KEY
        sync: false
      - key: TRADE101_MODEL
        value: claude-sonnet-5
